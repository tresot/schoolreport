<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolReport - Amis</title>
    <style>
        /* ===== VARIABLES ET THEMES ===== */
        :root {
            /* Couleurs de base */
            --primary: #4361ee;
            --primary-light: #5a75f1;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --accent: #4cc9f0;
            --success: #4cc9f0;
            --danger: #e63946;
            --warning: #f8961e;
            --info: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            
            /* Thème clair */
            --bg-primary: #f5f7fa;
            --bg-secondary: var(--light);
            --bg-tertiary: #ffffff;
            --text-primary: var(--dark);
            --text-secondary: var(--gray);
            --border-color: var(--light-gray);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --overlay-bg: rgba(245, 247, 250, 0.95);
            --bg-gradient: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);

            /* Thème sombre */
            --dark-bg-primary: #121212;
            --dark-bg-secondary: #1e1e1e;
            --dark-bg-tertiary: #2d2d2d;
            --dark-text-primary: #ffffff;
            --dark-text-secondary: #b3b3b3;
            --dark-border: #404040;
            --dark-shadow: rgba(0, 0, 0, 0.3);

            /* Animations */
            --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --transition-fast: 0.15s;
            --transition-normal: 0.3s;
            --transition-slow: 0.5s;
        }

        [data-theme="dark"] {
            --bg-primary: var(--dark-bg-primary);
            --bg-secondary: var(--dark-bg-secondary);
            --bg-tertiary: var(--dark-bg-tertiary);
            --text-primary: var(--dark-text-primary);
            --text-secondary: var(--dark-text-secondary);
            --border-color: var(--dark-border);
            --shadow-color: var(--dark-shadow);
            --overlay-bg: rgba(18, 18, 18, 0.95);
        }

        /* ===== BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: url('photos/background.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color var(--transition-normal) ease;
        }

        [data-theme="dark"] body {
            background-image: 
                linear-gradient(rgba(18, 18, 18, 0.8), rgba(18, 18, 18, 0.8)),
                url('photos/background.webp');
        }

        .overlay {
            background-color: var(--overlay-bg);
            backdrop-filter: blur(10px);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ===== LOADER ===== */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity var(--transition-slow) ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            will-change: transform;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all var(--transition-normal) ease;
        }

        [data-theme="dark"] .theme-toggle-container {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .theme-icon {
            font-size: 1rem;
            color: var(--primary);
            transition: all var(--transition-normal) ease;
        }

        .theme-switch {
            position: relative;
            width: 50px;
            height: 25px;
            background: var(--primary-light);
            border-radius: 25px;
            cursor: pointer;
            transition: all var(--transition-normal) ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            will-change: transform;
        }

        .theme-switch::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 21px;
            height: 21px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            will-change: transform;
        }

        [data-theme="dark"] .theme-switch {
            background: var(--dark-bg-tertiary);
        }

        [data-theme="dark"] .theme-switch::before {
            transform: translateX(25px);
            background: var(--primary);
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-gradient);
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px var(--shadow-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition-normal) ease;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-subtitle {
            opacity: 0.9;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition-normal) ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            will-change: transform;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ===== FRIENDS CONTENT ===== */
        .friends-container {
            background: var(--bg-tertiary);
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow-color);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .friends-header {
            background: var(--bg-gradient);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .friends-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .friends-header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition-normal) ease;
            border-bottom: 3px solid transparent;
            position: relative;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--bg-tertiary);
        }

        .tab:hover {
            background: rgba(67, 97, 238, 0.05);
            color: var(--primary-light);
        }

        .notification-badge {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: -5px;
            right: 15px;
        }

        .content {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .search-bar {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all var(--transition-normal) ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* ===== FRIEND ITEMS ===== */
        .friend-request, .friend-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            background: var(--bg-secondary);
            border-radius: 15px;
            transition: all var(--transition-normal) ease;
            border: 1px solid var(--border-color);
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.5s var(--ease-smooth) forwards;
        }

        .friend-request:hover, .friend-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-color);
            background: var(--bg-tertiary);
            border-color: var(--primary-light);
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 15px;
            border: 3px solid var(--bg-tertiary);
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.2);
            position: relative;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-container {
            position: relative;
        }

        .online-indicator {
            width: 16px;
            height: 16px;
            background: var(--success);
            border-radius: 50%;
            border: 2px solid var(--bg-tertiary);
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .friend-details {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .mutual-friends {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-normal) ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-accept {
            background: var(--primary);
            color: white;
        }

        .btn-accept:hover {
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .btn-decline {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .btn-decline:hover {
            background: var(--text-secondary);
            color: white;
        }

        .btn-add {
            background: var(--success);
            color: white;
        }

        .btn-add:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* ===== NOTIFICATIONS ===== */
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            font-weight: 600;
            transform: translateX(300px);
            transition: transform var(--transition-normal) ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.info {
            background: var(--info);
        }

        .notification.warning {
            background: var(--warning);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .theme-toggle-container {
                top: 10px;
                right: 10px;
                padding: 0.4rem 0.8rem;
            }

            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .header-actions {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                text-align: center;
                border-bottom: none;
                border-right: 3px solid transparent;
            }

            .tab.active {
                border-right-color: var(--primary);
                border-bottom-color: transparent;
            }

            .friend-request, .friend-item {
                padding: 12px;
            }

            .avatar {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .actions {
                flex-direction: column;
                gap: 5px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 13px;
            }
        }

        /* ===== PERFORMANCE OPTIMIZATIONS ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="overlay">
        <!-- Theme Toggle -->
        <div class="theme-toggle-container">
            <i class="theme-icon fas fa-sun" id="light-icon"></i>
            <div class="theme-switch" id="theme-switch"></div>
            <i class="theme-icon fas fa-moon" id="dark-icon"></i>
        </div>

        <div class="container">
            <header class="header">
                <div>
                    <h1>
                        <i class="fas fa-user-friends"></i>
                        SchoolReport - Amis
                    </h1>
                    <p class="header-subtitle">Connectez-vous avec vos camarades de classe</p>
                </div>

                <div class="header-actions">
                    <a href="center.html" class="back-btn">
                        <i class="fas fa-arrow-left"></i>
                        Retour au Dashboard
                    </a>
                </div>
            </header>

            <div class="friends-container">
                <div class="friends-header">
                    <h2>👥 Gestion des Amis</h2>
                    <p>Gérez vos connexions avec vos camarades</p>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="showTab('requests')">
                        <i class="fas fa-user-plus"></i>
                        Demandes
                        <span class="notification-badge" id="requests-badge">0</span>
                    </div>
                    <div class="tab" onclick="showTab('friends')">
                        <i class="fas fa-users"></i>
                        Mes amis
                    </div>
                    <div class="tab" onclick="showTab('suggestions')">
                        <i class="fas fa-search"></i>
                        Suggestions
                    </div>
                </div>

                <div class="content">
                    <div id="requests-tab" class="tab-content">
                        <div class="content" id="requests-content">
                            <div class="search-bar">
                                <input type="text" class="search-input" placeholder="Rechercher des demandes...">
                                <i class="search-icon fas fa-search"></i>
                            </div>
                            <!-- Le contenu sera chargé dynamiquement par Firebase -->
                        </div>
                    </div>

                    <div id="friends-tab" class="tab-content" style="display: none;">
                        <div class="content" id="friends-content">
                            <div class="search-bar">
                                <input type="text" class="search-input" placeholder="Rechercher parmi mes amis...">
                                <i class="search-icon fas fa-search"></i>
                            </div>
                            <!-- Le contenu sera chargé dynamiquement par Firebase -->
                        </div>
                    </div>

                    <div id="suggestions-tab" class="tab-content" style="display: none;">
                        <div class="content" id="suggestions-content">
                            <div class="search-bar">
                                <input type="text" class="search-input" placeholder="Rechercher des personnes...">
                                <i class="search-icon fas fa-search"></i>
                            </div>
                            <!-- Le contenu sera chargé dynamiquement par Firebase -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    
    <script type="module">
        // 🔥 IMPORTS FIREBASE
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, update, remove, push, serverTimestamp, off } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { app, auth, db } from "./firebase/firebase-config.js";

        // ===== GESTIONNAIRE DE THÈME =====
        class ThemeManager {
            constructor() {
                this.currentTheme = this.getInitialTheme();
                this.init();
            }

            getInitialTheme() {
                const savedTheme = localStorage.getItem('schoolreport-theme');
                if (savedTheme && (savedTheme === 'light' || savedTheme === 'dark')) {
                    return savedTheme;
                }

                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }

                return 'light';
            }

            init() {
                this.applyTheme(this.currentTheme);
                this.setupToggle();
            }

            applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                this.currentTheme = theme;
                localStorage.setItem('schoolreport-theme', theme);
                this.updateThemeIcons();
            }

            updateThemeIcons() {
                const lightIcon = document.getElementById('light-icon');
                const darkIcon = document.getElementById('dark-icon');
                
                if (lightIcon && darkIcon) {
                    lightIcon.style.opacity = this.currentTheme === 'dark' ? '0.5' : '1';
                    darkIcon.style.opacity = this.currentTheme === 'dark' ? '1' : '0.5';
                }
            }

            setupToggle() {
                const themeSwitch = document.getElementById('theme-switch');
                if (themeSwitch) {
                    themeSwitch.addEventListener('click', () => this.toggleTheme());
                }
            }

            toggleTheme() {
                this.applyTheme(this.currentTheme === 'light' ? 'dark' : 'light');
            }
        }

        // ===== GESTIONNAIRE D'AMIS FIREBASE =====
        class FriendsManager {
            constructor() {
                this.currentUser = null;
                this.friendRequests = [];
                this.friends = [];
                this.allUsers = [];
                this.onlineUsers = [];
                this.listeners = [];
            }

            async init() {
                // Vérifier l'authentification
                onAuthStateChanged(auth, (user) => {
                    if (!user) {
                        window.location.href = 'index.html';
                        return;
                    }
                    
                    this.currentUser = user;
                    this.setupFirebaseListeners();
                    this.setupEventListeners();
                });
            }

            setupFirebaseListeners() {
                if (!this.currentUser) return;

                // Écouter les demandes d'amis reçues
                const requestsRef = ref(db, `friendRequests/${this.currentUser.uid}`);
                const requestsListener = onValue(requestsRef, (snapshot) => {
                    this.friendRequests = [];
                    const data = snapshot.val();
                    
                    if (data) {
                        Object.entries(data).forEach(([senderUid, requestData]) => {
                            if (requestData.status === 'pending') {
                                this.friendRequests.push({
                                    id: senderUid,
                                    ...requestData
                                });
                            }
                        });
                    }
                    
                    this.updateRequestsUI();
                });
                this.listeners.push(() => off(requestsRef, 'value', requestsListener));

                // Écouter la liste des amis
                const friendsRef = ref(db, `friends/${this.currentUser.uid}`);
                const friendsListener = onValue(friendsRef, (snapshot) => {
                    this.friends = [];
                    const data = snapshot.val();
                    
                    if (data) {
                        Object.entries(data).forEach(([friendUid, friendData]) => {
                            this.friends.push({
                                id: friendUid,
                                ...friendData
                            });
                        });
                    }
                    
                    this.updateFriendsUI();
                });
                this.listeners.push(() => off(friendsRef, 'value', friendsListener));

                // Écouter tous les utilisateurs pour les suggestions
                const usersRef = ref(db, 'users');
                const usersListener = onValue(usersRef, (snapshot) => {
                    this.allUsers = [];
                    const data = snapshot.val();
                    
                    if (data) {
                        Object.entries(data).forEach(([uid, userData]) => {
                            if (uid !== this.currentUser.uid) {
                                this.allUsers.push({
                                    id: uid,
                                    ...userData
                                });
                            }
                        });
                    }
                    
                    this.updateSuggestionsUI();
                });
                this.listeners.push(() => off(usersRef, 'value', usersListener));

                // Écouter les utilisateurs en ligne
                const onlineRef = ref(db, 'connectedUsers');
                const onlineListener = onValue(onlineRef, (snapshot) => {
                    this.onlineUsers = [];
                    const data = snapshot.val();
                    
                    if (data) {
                        Object.keys(data).forEach(uid => {
                            this.onlineUsers.push(uid);
                        });
                    }
                    
                    this.updateOnlineStatus();
                });
                this.listeners.push(() => off(onlineRef, 'value', onlineListener));
            }

            updateRequestsUI() {
                const container = document.getElementById('requests-content');
                
                // Mise à jour du badge
                const badge = document.getElementById('requests-badge');
                if (this.friendRequests.length > 0) {
                    badge.textContent = this.friendRequests.length;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }

                // Nettoyer le contenu existant (sauf la barre de recherche)
                const searchBar = container.querySelector('.search-bar');
                container.innerHTML = '';
                if (searchBar) {
                    container.appendChild(searchBar);
                }

                if (this.friendRequests.length === 0) {
                    container.innerHTML += `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-user-friends"></i>
                            </div>
                            <p>Aucune demande d'ami en attente</p>
                        </div>
                    `;
                    return;
                }

                this.friendRequests.forEach((request, index) => {
                    const requestElement = this.createRequestElement(request, index);
                    container.appendChild(requestElement);
                });
            }

            updateFriendsUI() {
                const container = document.getElementById('friends-content');
                
                // Nettoyer le contenu existant (sauf la barre de recherche)
                const searchBar = container.querySelector('.search-bar');
                container.innerHTML = '';
                if (searchBar) {
                    container.appendChild(searchBar);
                }

                if (this.friends.length === 0) {
                    container.innerHTML += `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-users"></i>
                            </div>
                        </div>
                    `;
                    return;
                }

                this.friends.forEach((friend, index) => {
                    const friendElement = this.createFriendElement(friend, index);
                    container.appendChild(friendElement);
                });
            }

            updateSuggestionsUI() {
                const container = document.getElementById('suggestions-content');
                
                // Nettoyer le contenu existant (sauf la barre de recherche)
                const searchBar = container.querySelector('.search-bar');
                container.innerHTML = '';
                if (searchBar) {
                    container.appendChild(searchBar);
                }

                // Filtrer les utilisateurs (exclure les amis actuels et les demandes en cours)
                const friendIds = this.friends.map(f => f.id);
                const requestIds = this.friendRequests.map(r => r.id);
                
                const suggestions = this.allUsers.filter(user => 
                    !friendIds.includes(user.id) && 
                    !requestIds.includes(user.id)
                );

                if (suggestions.length === 0) {
                    container.innerHTML += `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-search"></i>
                            </div>
                            <p>Aucune suggestion disponible</p>
                        </div>
                    `;
                    return;
                }

                suggestions.slice(0, 10).forEach((user, index) => {
                    const suggestionElement = this.createSuggestionElement(user, index);
                    container.appendChild(suggestionElement);
                });
            }

            updateOnlineStatus() {
                // Mettre à jour les indicateurs en ligne
                document.querySelectorAll('.friend-item').forEach(item => {
                    const userId = item.dataset.userId;
                    const indicator = item.querySelector('.online-indicator');
                    
                    if (indicator) {
                        if (this.onlineUsers.includes(userId)) {
                            indicator.style.display = 'block';
                            item.querySelector('.friend-details').textContent = 
                                item.querySelector('.friend-details').textContent.replace('Hors ligne', 'En ligne');
                        } else {
                            indicator.style.display = 'none';
                            item.querySelector('.friend-details').textContent = 
                                item.querySelector('.friend-details').textContent.replace('En ligne', 'Hors ligne');
                        }
                    }
                });
            }

            createRequestElement(request, index) {
                const div = document.createElement('div');
                div.className = 'friend-request';
                div.style.animationDelay = `${index * 0.1}s`;
                div.dataset.userId = request.id;
                
                const initials = request.username ? request.username.charAt(0).toUpperCase() : '?';
                const profileImage = request.profileImage ? 
                    `<img src="${request.profileImage}" alt="${request.username}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">` : 
                    initials;

                div.innerHTML = `
                    <div class="avatar">${profileImage}</div>
                    <div class="friend-info">
                        <div class="friend-name">${request.username || 'Utilisateur'}</div>
                        <div class="friend-details">${request.email || ''}</div>
                        <div class="mutual-friends">Demande envoyée le ${new Date(request.timestamp).toLocaleDateString('fr-FR')}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-accept" onclick="window.friendsManager.acceptRequest('${request.id}')">
                            <i class="fas fa-check"></i>
                            Accepter
                        </button>
                        <button class="btn btn-decline" onclick="window.friendsManager.declineRequest('${request.id}')">
                            <i class="fas fa-times"></i>
                            Refuser
                        </button>
                    </div>
                `;
                
                return div;
            }

            createFriendElement(friend, index) {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.style.animationDelay = `${index * 0.1}s`;
                div.dataset.userId = friend.id;
                
                const initials = friend.username ? friend.username.charAt(0).toUpperCase() : '?';
                const profileImage = friend.profileImage ? 
                    `<img src="${friend.profileImage}" alt="${friend.username}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">` : 
                    initials;

                const isOnline = this.onlineUsers.includes(friend.id);
                const onlineIndicator = isOnline ? '<div class="online-indicator"></div>' : '';
                const status = isOnline ? 'En ligne' : 'Hors ligne';

                div.innerHTML = `
                    <div class="avatar-container">
                        <div class="avatar">${profileImage}</div>
                        ${onlineIndicator}
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">${friend.username || 'Utilisateur'}</div>
                        <div class="friend-details">${status} • Ami depuis ${new Date(friend.addedAt).toLocaleDateString('fr-FR')}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-accept" onclick="window.friendsManager.sendMessage('${friend.id}')">
                            <i class="fas fa-comment"></i>
                            Message
                        </button>
                        <button class="btn btn-decline" onclick="window.friendsManager.removeFriend('${friend.id}')" style="background: var(--danger);">
                            <i class="fas fa-user-minus"></i>
                            Retirer
                        </button>
                    </div>
                `;
                
                return div;
            }

            createSuggestionElement(user, index) {
                const div = document.createElement('div');
                div.className = 'friend-request';
                div.style.animationDelay = `${index * 0.1}s`;
                div.dataset.userId = user.id;
                
                const initials = user.username ? user.username.charAt(0).toUpperCase() : '?';
                const profileImage = user.profileImage ? 
                    `<img src="${user.profileImage}" alt="${user.username}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">` : 
                    initials;

                // Calculer les amis en commun (simulation pour l'instant)
                const mutualCount = Math.floor(Math.random() * 5);
                const mutualText = mutualCount > 0 ? `${mutualCount} ami${mutualCount > 1 ? 's' : ''} en commun` : 'Aucun ami en commun';

                div.innerHTML = `
                    <div class="avatar">${profileImage}</div>
                    <div class="friend-info">
                        <div class="friend-name">${user.username || 'Utilisateur'}</div>
                        <div class="friend-details">${user.email || ''}</div>
                        <div class="mutual-friends">${mutualText}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-add" onclick="window.friendsManager.sendFriendRequest('${user.id}')">
                            <i class="fas fa-plus"></i>
                            Ajouter
                        </button>
                    </div>
                `;
                
                return div;
            }

            async sendFriendRequest(targetUserId) {
                try {
                    // Vérifier que l'utilisateur cible existe
                    const targetUser = this.allUsers.find(u => u.id === targetUserId);
                    if (!targetUser) {
                        showNotification('Utilisateur introuvable', 'warning');
                        return;
                    }

                    // Ajouter la demande dans la base du destinataire
                    const requestRef = ref(db, `friendRequests/${targetUserId}/${this.currentUser.uid}`);
                    
                    // Récupérer les infos de l'utilisateur actuel
                    const currentUserRef = ref(db, `users/${this.currentUser.uid}`);
                    const currentUserSnapshot = await new Promise((resolve) => {
                        onValue(currentUserRef, resolve, { onlyOnce: true });
                    });
                    
                    const currentUserData = currentUserSnapshot.val();
                    
                    await set(requestRef, {
                        username: currentUserData.username,
                        email: this.currentUser.email,
                        profileImage: currentUserData.profileImage || null,
                        timestamp: Date.now(),
                        status: 'pending'
                    });

                    // Mettre à jour l'UI
                    const button = document.querySelector(`[data-user-id="${targetUserId}"] .btn-add`);
                    if (button) {
                        button.innerHTML = '<i class="fas fa-check"></i> Envoyé';
                        button.style.background = 'var(--success)';
                        button.disabled = true;
                    }

                    showNotification(`Demande envoyée à ${targetUser.username} ! 📨`, 'success');
                    
                } catch (error) {
                    console.error('Erreur lors de l\'envoi de la demande:', error);
                    showNotification('Erreur lors de l\'envoi de la demande', 'warning');
                }
            }

            async acceptRequest(senderUserId) {
                try {
                    const request = this.friendRequests.find(r => r.id === senderUserId);
                    if (!request) return;

                    // Ajouter dans la liste d'amis des deux utilisateurs
                    const batch = {};
                    
                    // Ajouter l'ami dans la liste de l'utilisateur actuel
                    batch[`friends/${this.currentUser.uid}/${senderUserId}`] = {
                        username: request.username,
                        email: request.email,
                        profileImage: request.profileImage,
                        addedAt: Date.now()
                    };

                    // Récupérer les infos de l'utilisateur actuel pour l'ajouter à la liste de l'expéditeur
                    const currentUserRef = ref(db, `users/${this.currentUser.uid}`);
                    const currentUserSnapshot = await new Promise((resolve) => {
                        onValue(currentUserRef, resolve, { onlyOnce: true });
                    });
                    const currentUserData = currentUserSnapshot.val();

                    // Ajouter l'utilisateur actuel dans la liste d'amis de l'expéditeur
                    batch[`friends/${senderUserId}/${this.currentUser.uid}`] = {
                        username: currentUserData.username,
                        email: this.currentUser.email,
                        profileImage: currentUserData.profileImage,
                        addedAt: Date.now()
                    };

                    // Supprimer la demande
                    batch[`friendRequests/${this.currentUser.uid}/${senderUserId}`] = null;

                    // Appliquer toutes les modifications
                    await update(ref(db), batch);

                    showNotification(`${request.username} a été ajouté à vos amis ! 🎉`, 'success');
                    
                } catch (error) {
                    console.error('Erreur lors de l\'acceptation:', error);
                    showNotification('Erreur lors de l\'acceptation de la demande', 'warning');
                }
            }

            async declineRequest(senderUserId) {
                try {
                    const request = this.friendRequests.find(r => r.id === senderUserId);
                    if (!request) return;

                    // Supprimer la demande
                    const requestRef = ref(db, `friendRequests/${this.currentUser.uid}/${senderUserId}`);
                    await remove(requestRef);

                    showNotification(`Demande de ${request.username} refusée`, 'info');
                    
                } catch (error) {
                    console.error('Erreur lors du refus:', error);
                    showNotification('Erreur lors du refus de la demande', 'warning');
                }
            }

            async removeFriend(friendUserId) {
                const friend = this.friends.find(f => f.id === friendUserId);
                if (!friend) return;

                const confirmed = confirm(`Êtes-vous sûr de vouloir retirer ${friend.username} de vos amis ?`);
                if (!confirmed) return;

                try {
                    // Supprimer des deux listes d'amis
                    const batch = {};
                    batch[`friends/${this.currentUser.uid}/${friendUserId}`] = null;
                    batch[`friends/${friendUserId}/${this.currentUser.uid}`] = null;

                    await update(ref(db), batch);

                    showNotification(`${friend.username} a été retiré de vos amis`, 'info');
                    
                } catch (error) {
                    console.error('Erreur lors de la suppression:', error);
                    showNotification('Erreur lors de la suppression de l\'ami', 'warning');
                }
            }

            sendMessage(friendUserId) {
                const friend = this.friends.find(f => f.id === friendUserId);
                if (!friend) return;

                showNotification(`Redirection vers la conversation avec ${friend.username}...`, 'info');
                
                setTimeout(() => {
                    // Rediriger vers le chat avec cet ami spécifique
                    window.location.href = `chat.html?friend=${friendUserId}`;
                }, 1500);
            }

            setupEventListeners() {
                // Recherche en temps réel
                this.setupSearch();
                
                // Navigation clavier
                this.setupKeyboardNavigation();
            }

            setupSearch() {
                document.querySelectorAll('.search-input').forEach(input => {
                    input.addEventListener('input', function() {
                        const searchTerm = this.value.toLowerCase();
                        const container = this.closest('.tab-content');
                        const items = container.querySelectorAll('.friend-request, .friend-item');
                        
                        items.forEach(item => {
                            const name = item.querySelector('.friend-name')?.textContent.toLowerCase() || '';
                            const details = item.querySelector('.friend-details')?.textContent.toLowerCase() || '';
                            
                            if (name.includes(searchTerm) || details.includes(searchTerm)) {
                                item.style.display = 'flex';
                                item.style.animation = 'slideInUp 0.3s ease forwards';
                            } else {
                                item.style.display = 'none';
                            }
                        });
                        
                        // Afficher un message si aucun résultat
                        const visibleItems = container.querySelectorAll('.friend-request:not([style*="display: none"]), .friend-item:not([style*="display: none"])');
                        let emptyState = container.querySelector('.search-empty-state');
                        
                        if (visibleItems.length === 0 && searchTerm.length > 0) {
                            if (!emptyState) {
                                emptyState = document.createElement('div');
                                emptyState.className = 'empty-state search-empty-state';
                                emptyState.innerHTML = `
                                    <div class="empty-icon">
                                        <i class="fas fa-search"></i>
                                    </div>
                                    <p>Aucun résultat trouvé pour "${searchTerm}"</p>
                                `;
                                container.appendChild(emptyState);
                            }
                        } else if (emptyState) {
                            emptyState.remove();
                        }
                    });
                });
            }

            setupKeyboardNavigation() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        // Réinitialiser les recherches
                        document.querySelectorAll('.search-input').forEach(input => {
                            input.value = '';
                            input.dispatchEvent(new Event('input'));
                        });
                    }
                    
                    // Navigation entre onglets avec les flèches
                    if (e.ctrlKey) {
                        const tabs = document.querySelectorAll('.tab');
                        const activeTab = document.querySelector('.tab.active');
                        const currentIndex = Array.from(tabs).indexOf(activeTab);
                        
                        if (e.key === 'ArrowLeft' && currentIndex > 0) {
                            e.preventDefault();
                            tabs[currentIndex - 1].click();
                        } else if (e.key === 'ArrowRight' && currentIndex < tabs.length - 1) {
                            e.preventDefault();
                            tabs[currentIndex + 1].click();
                        }
                    }
                    
                    // Raccourcis pour les onglets
                    if (e.altKey) {
                        switch(e.key) {
                            case '1':
                                e.preventDefault();
                                showTab('requests');
                                break;
                            case '2':
                                e.preventDefault();
                                showTab('friends');
                                break;
                            case '3':
                                e.preventDefault();
                                showTab('suggestions');
                                break;
                        }
                    }
                    
                    // Raccourci pour le thème
                    if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                        e.preventDefault();
                        window.themeManager.toggleTheme();
                    }
                });
            }

            cleanup() {
                // Nettoyer les listeners Firebase
                this.listeners.forEach(unsubscribe => unsubscribe());
                this.listeners = [];
            }
        }

        // ===== GESTIONNAIRE DE NOTIFICATIONS =====
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icon = type === 'success' ? 'fas fa-check-circle' : 
                        type === 'info' ? 'fas fa-info-circle' : 
                        type === 'warning' ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';
            
            notification.innerHTML = `
                <i class="${icon}"></i>
                ${message}
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // ===== GESTIONNAIRE D'ONGLETS =====
        function showTab(tabName) {
            // Masquer tous les onglets
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => tab.style.display = 'none');
            
            // Retirer la classe active de tous les onglets
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Afficher l'onglet sélectionné
            const targetTab = document.getElementById(tabName + '-tab');
            if (targetTab) {
                targetTab.style.display = 'block';
            }
            
            // Ajouter la classe active à l'onglet cliqué
            const clickedTab = document.querySelector(`[onclick="showTab('${tabName}')"]`);
            if (clickedTab) {
                clickedTab.classList.add('active');
            }
            
            // Réanimer les éléments
            const items = targetTab?.querySelectorAll('.friend-request, .friend-item');
            if (items) {
                items.forEach((item, index) => {
                    item.style.animation = 'none';
                    item.offsetHeight; // Trigger reflow
                    item.style.animation = `slideInUp 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards`;
                    item.style.animationDelay = `${index * 0.1}s`;
                });
            }
        }

        // ===== FONCTIONS GLOBALES POUR L'INTERFACE =====
        window.showTab = showTab;
        window.showNotification = showNotification;

        // ===== INITIALISATION PRINCIPALE =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initialisation de la page Amis avec Firebase...');
            
            // Initialisation du gestionnaire de thème
            window.themeManager = new ThemeManager();
            
            // Initialisation du gestionnaire d'amis Firebase
            window.friendsManager = new FriendsManager();
            window.friendsManager.init();
            
            // Masquer le loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) loader.classList.add('hidden');
            }, 1000);
            
            // Nettoyage à la fermeture de la page
            window.addEventListener('beforeunload', () => {
                if (window.friendsManager) {
                    window.friendsManager.cleanup();
                }
            });
        });

        // ===== OPTIMISATIONS PERFORMANCES =====
        if (window.innerWidth <= 768) {
            document.documentElement.style.setProperty('--transition-normal', '0.2s');
            document.documentElement.style.setProperty('--transition-slow', '0.3s');
        }

        // Optimisation pour les appareils à performance réduite
        if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) {
            document.documentElement.style.setProperty('--transition-normal', '0.15s');
            document.documentElement.style.setProperty('--transition-slow', '0.25s');
        }

        // ===== GESTION DES ERREURS GLOBALES =====
        window.addEventListener('error', (event) => {
            console.error('Erreur JavaScript:', event.error);
            showNotification('Une erreur est survenue. Veuillez recharger la page.', 'warning');
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Promesse rejetée:', event.reason);
            showNotification('Erreur de connexion. Vérifiez votre connexion internet.', 'warning');
        });

    </script>
</body>
</html>
