<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SchoolReport - Connexion</title>
    <link rel="preload" href="photos/background1.webp" as="image">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgbZ8YHHPbaKWmEMzwI65jXflv-8qYCVM",
            authDomain: "schoolreport-f8db0.firebaseapp.com",
            projectId: "schoolreport-f8db0",
            storageBucket: "schoolreport-f8db0.appspot.com",
            messagingSenderId: "313069994450",
            appId: "1:313069994450:web:37b009be4f1812fdca880b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.signUp = async (email, password) => {
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                toastr.success('Compte créé avec succès ! Redirection...');
                gsap.to(".container", {
                    duration: 0.5,
                    scale: 0.9,
                    opacity: 0,
                    ease: "power2.in",
                    onComplete: () => {
                        setTimeout(() => window.location.href = 'center.html', 300);
                    }
                });
            } catch (error) {
                toastr.error(error.message);
            }
        };

        window.signIn = async (email, password) => {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                toastr.success('Connexion réussie ! Redirection...');
                gsap.to(".container", {
                    duration: 0.5,
                    scale: 0.9,
                    opacity: 0,
                    ease: "power2.in",
                    onComplete: () => {
                        setTimeout(() => window.location.href = 'center.html', 300);
                    }
                });
            } catch (error) {
                toastr.error(error.message);
            }
        };

        window.toggleForms = () => {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (loginForm.classList.contains('hidden')) {
                // Transition from signup to login
                gsap.to(signupForm, {
                    duration: 0.3,
                    opacity: 0,
                    y: 20,
                    ease: "power1.in",
                    onComplete: () => {
                        signupForm.classList.add('hidden');
                        loginForm.classList.remove('hidden');
                        gsap.fromTo(loginForm, 
                            { opacity: 0, y: -20 },
                            { duration: 0.3, opacity: 1, y: 0, ease: "power1.out" }
                        );
                    }
                });
            } else {
                // Transition from login to signup
                gsap.to(loginForm, {
                    duration: 0.3,
                    opacity: 0,
                    y: 20,
                    ease: "power1.in",
                    onComplete: () => {
                        loginForm.classList.add('hidden');
                        signupForm.classList.remove('hidden');
                        gsap.fromTo(signupForm, 
                            { opacity: 0, y: -20 },
                            { duration: 0.3, opacity: 1, y: 0, ease: "power1.out" }
                        );
                    }
                });
            }
            
            // Update tabs
            document.querySelector('.nav-tabs .nav-tab:nth-child(1)').classList.toggle('active');
            document.querySelector('.nav-tabs .nav-tab:nth-child(2)').classList.toggle('active');
        };
    </script>
    <style>
        :root {
            --primary-blue: rgba(67, 97, 238, 0.8);      /* bleu légèrement transparent */
            --primary-green: rgba(76, 201, 240, 0.8);    /* vert légèrement transparent */
            --secondary-color: rgba(63, 55, 201, 0.8);
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --glass-color: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glow-color: rgba(67, 97, 238, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('photos/background1.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: none; /* Hidden by default, shown only on desktop */
        }

        @media (min-width: 1024px) {
            #particles-js {
                display: block;
            }
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease-out;
            will-change: opacity;
        }

        .intro-screen h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulse 2s infinite;
        }

        .scroll-hint {
            position: absolute;
            bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bounce 2s infinite;
        }

        .scroll-hint span {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .scroll-arrow {
            width: 30px;
            height: 50px;
            border: 2px solid white;
            border-radius: 15px;
            position: relative;
        }

        .scroll-arrow::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: scrollDown 2s infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            background: var(--glass-color);
            border-radius: 20px;
            padding: 40px;
            margin: 20px;
            border: 1px solid var(--glass-border);
            transform: translateY(100px);
            opacity: 0;
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            display: inline-block;
        }

        .logo h1 span.school {
            color: var(--primary-blue);
        }

        .logo h1 span.report {
            color: var(--primary-green);
        }

        .logo p {
            color: var(--light-color);
            font-size: 14px;
            opacity: 0.8;
        }

        .current-time {
            position: absolute;
            top: 0;
            right: 0;
            color: white;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
        }

        #error-message {
            color: var(--error-color);
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 5px;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-form {
            width: 100%;
        }

        .auth-form.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--light-color);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            will-change: transform, box-shadow;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
        }

        .form-group input:valid {
            border-color: var(--primary-green);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s;
        }

        .toggle-password:hover {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--light-color);
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input {
            margin-right: 5px;
            accent-color: var(--primary-blue);
        }

        .forgot-password a {
            color: var(--light-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: var(--primary-blue);
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--primary-blue), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-blue));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn:hover::after {
            opacity: 1;
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--light-color);
        }

        .toggle-form a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toggle-form a:hover {
            color: var(--primary-green);
            text-decoration: underline;
        }

        .nav-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            position: relative;
        }

        .nav-tab.active {
            color: white;
            border-bottom-color: var(--primary-blue);
        }

        .nav-tab:hover {
            color: white;
        }

        .cursor-effect {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(67, 97, 238, 0.5);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999;
            mix-blend-mode: screen;
            transition: transform 0.1s ease;
            will-change: transform;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        @keyframes scrollDown {
            0% { 
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% { 
                opacity: 0;
                transform: translate(-50%, 15px);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .logo h1 {
                font-size: 2rem;
            }

            .intro-screen h1 {
                font-size: 2.5rem;
            }
        }
        
        html, body {
            height: 200vh; 
        }
        
        .intro-screen {
            height: 100vh; 
            position: fixed;
        }
        
        .container {
            margin-top: 100vh; 
            position: absolute;
        }

        /* Toastr customization */
        #toast-container > .toast {
            background-image: none !important;
            padding: 15px 15px 15px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #toast-container > .toast-success {
            color: #fff;
            background-color: rgba(76, 201, 240, 0.8);
        }

        #toast-container > .toast-error {
            color: #fff;
            background-color: rgba(247, 37, 133, 0.8);
        }

        #toast-container > div {
            opacity: 1;
        }

        .toast-close-button {
            color: white;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="intro-screen">
        <h1 class="animate__animated animate__fadeIn">SchoolReport</h1>
        <div class="scroll-hint animate__animated animate__fadeIn animate__delay-1s">
            <span>Scroll down</span>
            <div class="scroll-arrow"></div>
        </div>
    </div>

    <div class="cursor-effect" id="cursor-effect"></div>

    <div class="container" id="login-container">
        <div class="logo">
            <div class="current-time" id="current-time"></div>
            <h1><span class="school">School</span><span class="report">Report</span></h1>
            <p id="welcome-text">Plateforme collaborative pour étudiants</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="showLoginForm()">Login</div>
            <div class="nav-tab" onclick="showSignupForm()">Register</div>
        </div>

        <div id="error-message"></div>

        <!-- Formulaire de Connexion -->
        <div id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Entrez votre email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <div class="password-container">
                    <input type="password" id="login-password" placeholder="Entrez votre mot de passe" required>
                    <button type="button" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Se souvenir de moi</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Mot de passe oublié ?</a>
                </div>
            </div>
            <button class="submit-btn" onclick="signIn(document.getElementById('login-email').value, document.getElementById('login-password').value)">
                <span>Se connecter</span>
            </button>
        </div>

        <!-- Formulaire d'Inscription -->
        <div id="signup-form" class="auth-form hidden">
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Entrez votre email" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Mot de passe</label>
                <div class="password-container">
                    <input type="password" id="signup-password" placeholder="Créez un mot de passe" required>
                    <button type="button" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="signup-confirm">Confirmer le mot de passe</label>
                <div class="password-container">
                    <input type="password" id="signup-confirm" placeholder="Confirmez votre mot de passe" required>
                    <button type="button" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button class="submit-btn" onclick="
                if (document.getElementById('signup-password').value !== document.getElementById('signup-confirm').value) {
                    toastr.error('Les mots de passe ne correspondent pas');
                } else {
                    signUp(document.getElementById('signup-email').value, document.getElementById('signup-password').value);
                }
            ">
                <span>Créer un compte</span>
            </button>
            <div class="toggle-form">
                Déjà inscrit ? <a onclick="toggleForms()">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        // Configure Toastr
        toastr.options = {
            "closeButton": true,
            "debug": false,
            "newestOnTop": true,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "preventDuplicates": false,
            "onclick": null,
            "showDuration": "300",
            "hideDuration": "1000",
            "timeOut": "5000",
            "extendedTimeOut": "1000",
            "showEasing": "swing",
            "hideEasing": "linear",
            "showMethod": "fadeIn",
            "hideMethod": "fadeOut"
        };

        // Initialisation des particules (optimisé pour performance)
        function initParticles() {
            if (window.innerWidth >= 1024) {
                particlesJS('particles-js', {
                    "particles": {
                        "number": {
                            "value": 80,
                            "density": {
                                "enable": true,
                                "value_area": 800
                            }
                        },
                        "color": {
                            "value": "#ffffff"
                        },
                        "shape": {
                            "type": "circle",
                            "stroke": {
                                "width": 0,
                                "color": "#000000"
                            }
                        },
                        "opacity": {
                            "value": 0.5,
                            "random": true,
                            "anim": {
                                "enable": true,
                                "speed": 1,
                                "opacity_min": 0.3,
                                "sync": false
                            }
                        },
                        "size": {
                            "value": 4,
                            "random": true,
                            "anim": {
                                "enable": false,
                                "speed": 40,
                                "size_min": 0.1,
                                "sync": false
                            }
                        },
                        "line_linked": {
                            "enable": true,
                            "distance": 150,
                            "color": "#ffffff",
                            "opacity": 0.4,
                            "width": 1
                        },
                        "move": {
                            "enable": true,
                            "speed": 2,
                            "direction": "none",
                            "random": true,
                            "straight": false,
                            "out_mode": "out",
                            "bounce": false,
                            "attract": {
                                "enable": false,
                                "rotateX": 600,
                                "rotateY": 1200
                            }
                        }
                    },
                    "interactivity": {
                        "detect_on": "canvas",
                        "events": {
                            "onhover": {
                                "enable": true,
                                "mode": "grab"
                            },
                            "onclick": {
                                "enable": true,
                                "mode": "push"
                            },
                            "resize": true
                        },
                        "modes": {
                            "grab": {
                                "distance": 140,
                                "line_linked": {
                                    "opacity": 1
                                }
                            },
                            "bubble": {
                                "distance": 400,
                                "size": 40,
                                "duration": 2,
                                "opacity": 8,
                                "speed": 3
                            },
                            "repulse": {
                                "distance": 200,
                                "duration": 0.4
                            },
                            "push": {
                                "particles_nb": 4
                            },
                            "remove": {
                                "particles_nb": 2
                            }
                        }
                    },
                    "retina_detect": true
                });
            }
        }

        // Animation d'entrée du container
        function animateContainerEntry() {
            gsap.to(".container", {
                duration: 1.5,
                opacity: 1,
                scale: 1,
                y: 0,
                ease: "elastic.out(1, 0.5)",
                delay: 0.5
            });

            // Animation des éléments du formulaire
            gsap.from(".form-group", {
                duration: 0.8,
                opacity: 0,
                y: 20,
                stagger: 0.1,
                delay: 1,
                ease: "back.out(1.7)"
            });

            // Animation du logo
            gsap.from(".logo h1", {
                duration: 1,
                opacity: 0,
                y: -30,
                delay: 0.3,
                ease: "bounce.out"
            });

            gsap.from(".logo p", {
                duration: 0.8,
                opacity: 0,
                y: 20,
                delay: 0.8,
                ease: "power2.out"
            });

            // Animation des onglets
            gsap.from(".nav-tab", {
                duration: 0.6,
                opacity: 0,
                x: (i) => i === 0 ? -30 : 30,
                stagger: 0.1,
                delay: 1.2,
                ease: "power2.out"
            });
        }

        // Gestion optimisée du scroll
        function handleScroll() {
            const introScreen = document.querySelector('.intro-screen');
            const loginContainer = document.getElementById('login-container');
            const scrollPosition = window.scrollY;
            
            requestAnimationFrame(() => {
                if (scrollPosition > 50) { 
                    introScreen.style.opacity = 1 - (scrollPosition / 100);
                    introScreen.style.pointerEvents = 'none';
                    
                    if (scrollPosition > 150) {
                        loginContainer.style.opacity = 1;
                        loginContainer.style.transform = 'translateY(0)';
                    } else {
                        loginContainer.style.opacity = (scrollPosition - 50) / 100;
                        loginContainer.style.transform = `translateY(${Math.max(0, 100 - scrollPosition)}px)`;
                    }
                } else {
                    introScreen.style.opacity = '1';
                    introScreen.style.pointerEvents = 'auto';
                    loginContainer.style.opacity = '0';
                    loginContainer.style.transform = 'translateY(100px)';
                }
            });
        }

        // Fonction pour basculer entre les formulaires
        function showLoginForm() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (!loginForm.classList.contains('hidden')) return;
            
            // Animation de transition
            gsap.to(signupForm, {
                duration: 0.3,
                opacity: 0,
                y: 20,
                ease: "power1.in",
                onComplete: () => {
                    signupForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    gsap.fromTo(loginForm, 
                        { opacity: 0, y: -20 },
                        { duration: 0.3, opacity: 1, y: 0, ease: "power1.out" }
                    );
                }
            });
            
            // Mise à jour des onglets
            document.querySelector('.nav-tabs .nav-tab:nth-child(1)').classList.add('active');
            document.querySelector('.nav-tabs .nav-tab:nth-child(2)').classList.remove('active');
        }

        function showSignupForm() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (!signupForm.classList.contains('hidden')) return;
            
            // Animation de transition
            gsap.to(loginForm, {
                duration: 0.3,
                opacity: 0,
                y: 20,
                ease: "power1.in",
                onComplete: () => {
                    loginForm.classList.add('hidden');
                    signupForm.classList.remove('hidden');
                    gsap.fromTo(signupForm, 
                        { opacity: 0, y: -20 },
                        { duration: 0.3, opacity: 1, y: 0, ease: "power1.out" }
                    );
                }
            });
            
            // Mise à jour des onglets
            document.querySelector('.nav-tabs .nav-tab:nth-child(1)').classList.remove('active');
            document.querySelector('.nav-tabs .nav-tab:nth-child(2)').classList.add('active');
        }

        // Fonction pour basculer la visibilité du mot de passe
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('svg');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
            input.focus();
        }

        // Effet de curseur personnalisé optimisé
        function initCursorEffect() {
            const cursor = document.getElementById('cursor-effect');
            let lastX = 0;
            let lastY = 0;
            let mouseX = 0;
            let mouseY = 0;
            let scale = 1;
            let isInteractive = false;
            
            function moveCursor() {
                const dx = mouseX - lastX;
                const dy = mouseY - lastY;
                
                lastX += dx * 0.2;
                lastY += dy * 0.2;
                
                cursor.style.transform = `translate(${lastX}px, ${lastY}px) scale(${scale})`;
                
                requestAnimationFrame(moveCursor);
            }
            
            moveCursor();
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                if (!isInteractive) {
                    const interactiveElements = document.querySelectorAll('button, a, input, .nav-tab');
                    isInteractive = Array.from(interactiveElements).some(el => el.matches(':hover'));
                    
                    if (isInteractive) {
                        scale = 2;
                        cursor.style.background = 'rgba(67, 97, 238, 0.3)';
                    } else {
                        scale = 1;
                        cursor.style.background = 'rgba(67, 97, 238, 0.5)';
                    }
                }
            });
            
            document.addEventListener('mouseout', () => {
                isInteractive = false;
            });
            
            document.addEventListener('mousedown', () => {
                scale = 0.8;
                gsap.to(cursor, {
                    duration: 0.1,
                    scale: 0.8
                });
            });
            
            document.addEventListener('mouseup', () => {
                scale = isInteractive ? 2 : 1;
                gsap.to(cursor, {
                    duration: 0.1,
                    scale: scale
                });
            });
        }

        // Mise à jour de l'heure
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-time').textContent = timeString;
        }

        // Effet ripple sur les boutons
        function initRippleEffect() {
            document.querySelectorAll('.submit-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const circle = document.createElement('span');
                    circle.classList.add('ripple');
                    circle.style.left = `${x}px`;
                    circle.style.top = `${y}px`;
                    
                    this.appendChild(circle);
                    
                    gsap.to(circle, {
                        duration: 0.6,
                        scale: 4,
                        opacity: 0,
                        ease: "power2.out",
                        onComplete: () => circle.remove()
                    });
                });
            });
        }

        // Réponse visuelle en temps réel
        function initInputFeedback() {
            const emailInput = document.getElementById('login-email');
            const welcomeText = document.getElementById('welcome-text');
            
            emailInput.addEventListener('input', () => {
                if (emailInput.value) {
                    welcomeText.textContent = `Bienvenue, ${emailInput.value.split('@')[0]}`;
                    gsap.to(welcomeText, {
                        duration: 0.3,
                        y: -5,
                        opacity: 0,
                        ease: "power1.out",
                        onComplete: () => {
                            welcomeText.textContent = `Bienvenue, ${emailInput.value.split('@')[0]}`;
                            gsap.to(welcomeText, {
                                duration: 0.3,
                                y: 0,
                                opacity: 1,
                                ease: "power1.in"
                            });
                        }
                    });
                } else {
                    gsap.to(welcomeText, {
                        duration: 0.3,
                        y: -5,
                        opacity: 0,
                        ease: "power1.out",
                        onComplete: () => {
                            welcomeText.textContent = 'Plateforme collaborative pour étudiants';
                            gsap.to(welcomeText, {
                                duration: 0.3,
                                y: 0,
                                opacity: 1,
                                ease: "power1.in"
                            });
                        }
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser les particules
            initParticles();
            
            // Configurer Toastr
            toastr.options.positionClass = window.innerWidth <= 768 ? 'toast-top-center' : 'toast-top-right';
            
            // Ajouter les écouteurs d'événements pour les boutons de visibilité du mot de passe
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function() {
                    const inputId = this.parentElement.querySelector('input').id;
                    togglePasswordVisibility(inputId);
                });
            });
            
            // Initialiser l'effet de curseur optimisé
            initCursorEffect();
            
            // Initialiser l'effet ripple
            initRippleEffect();
            
            // Initialiser le feedback des inputs
            initInputFeedback();
            
            // Mettre à jour l'heure
            updateTime();
            setInterval(updateTime, 1000);
            
            // Gestion optimisée du scroll avec debounce
            let isScrolling;
            window.addEventListener('scroll', function() {
                window.clearTimeout(isScrolling);
                isScrolling = setTimeout(handleScroll, 16);
            }, { passive: true });
            
            // Forcer le scroll initial sur mobile
            setTimeout(() => {
                if (window.innerWidth <= 768) {
                    window.scrollTo({ top: 1, behavior: 'smooth' });
                }
            }, 1000);
            
            // Animation d'entrée après un court délai
            setTimeout(() => {
                animateContainerEntry();
            }, 300);
            
            // Animation de l'écran d'intro
            gsap.from(".intro-screen h1", {
                duration: 1.5,
                opacity: 0,
                y: -50,
                scale: 0.8,
                ease: "elastic.out(1, 0.5)",
                delay: 0.2
            });
            
            gsap.from(".scroll-hint", {
                duration: 1,
                opacity: 0,
                y: 30,
                ease: "power2.out",
                delay: 1.5
            });
        });

        // Gestion du redimensionnement
        window.addEventListener('resize', function() {
            toastr.options.positionClass = window.innerWidth <= 768 ? 'toast-top-center' : 'toast-top-right';
        });
    </script>
</body>
</html>
