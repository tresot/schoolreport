<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimoire du Savoir - Codex</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #f5f3e7, #eae4d3);
      font-family: 'Cinzel Decorative', serif;
      color: #3f3b2e;
      padding: 2rem;
      line-height: 1.8;
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      text-align: center;
      color: #4e3a21;
      margin-bottom: 2rem;
    }
    .search-section {
      text-align: center;
      margin-bottom: 2rem;
    }
    .search-section input {
      padding: 0.75rem;
      width: 80%;
      max-width: 400px;
      font-size: 1.1rem;
      border: 2px solid #8b7c5a;
      border-radius: 8px;
      font-family: 'Cinzel Decorative', serif;
    }
    .search-section button {
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      background-color: #8b7c5a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cinzel Decorative', serif;
      margin-left: 0.5rem;
    }
    .result-card {
      background-color: #fffdf8;
      border: 1px solid #d6c9aa;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    .result-card h3 {
      font-family: 'Great Vibes', cursive;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .result-card p {
      font-size: 1rem;
      font-family: Georgia, serif;
    }
    .result-card a {
      color: #6d4c41;
      text-decoration: underline;
    }
    @media screen and (max-width: 600px) {
      .search-section input[type="text"] {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <h1>Codex Magisterium</h1>
  <div class="search-section">
    <input type="text" id="searchInput" placeholder="Entrez un mot-clé...">
    <button onclick="searchWikipedia()">Rechercher</button>
  </div>

  <div id="results"></div>

  <script>
    async function searchWikipedia() {
      const query = document.getElementById('searchInput').value;
      const searchURL = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
      const response = await fetch(searchURL);
      const data = await response.json();
      const results = data.query.search;

      const resultArea = document.getElementById('results');
      resultArea.innerHTML = '';

      for (const item of results) {
        const title = item.title;
        const pageURL = `https://fr.wikipedia.org/wiki/${encodeURIComponent(title)}`;
        const snippet = item.snippet.replace(/<[^>]+>/g, '');

        const detailsURL = `https://fr.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&titles=${encodeURIComponent(title)}&pithumbsize=200&origin=*`;
        const detailsResponse = await fetch(detailsURL);
        const detailsData = await detailsResponse.json();
        const pages = detailsData.query.pages;
        const page = Object.values(pages)[0];
        const thumbnail = page.thumbnail ? page.thumbnail.source : null;

        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <h3>${title}</h3>
          ${thumbnail ? `<img src="${thumbnail}" alt="${title}" style="max-width:100%; border-radius:8px; margin-bottom:10px;">` : ''}
          <p>${snippet}...</p>
          <a href="${pageURL}" target="_blank">Lire sur Wikipedia</a>
        `;
        resultArea.appendChild(card);
      }
    }
  </script>
</body>
</html>
