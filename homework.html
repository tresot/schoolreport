<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolReport - Gestion des Devoirs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --warning: #f8961e;
            --danger: #e63946;
            --calendar: #3B82F6;
            --text-primary: #CCD6F6;
            --text-secondary: #8892B0;
            --input-bg: #112240;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--dark);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.75rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .calendar-card, .homework-card {
            background: rgba(16, 36, 69, 0.85);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.1);
            overflow: hidden;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--primary);
            color: white;
        }

        .calendar-header h2 {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .today-button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin: 1rem;
        }

        .today-button:hover {
            background-color: var(--primary-dark);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #e2e8f0;
            padding: 0.5rem 0;
            text-align: center;
            font-weight: 600;
            color: var(--dark);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            padding: 1rem;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-width: 40px;
            font-size: 16px;
            color: var(--text-primary);
        }

        .day:hover {
            background-color: var(--gray);
            color: white;
        }

        .day.today {
            background-color: var(--calendar);
            color: white;
            font-weight: bold;
        }

        .day.selected {
            border: 2px solid var(--calendar);
        }

        .day.other-month {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .day.has-homework::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 6px;
            background-color: var(--danger);
            border-radius: 50%;
        }

        .homework-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .homework-header h2 {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--primary-light);
        }

        .date-display {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .homework-list {
            padding: 1rem;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .homework-item {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            position: relative;
            transition: all 0.2s;
        }

        .homework-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .homework-item.completed {
            opacity: 0.7;
            border-left-color: var(--success);
        }

        .homework-item.completed .homework-content {
            text-decoration: line-through;
        }

        .homework-content {
            margin-bottom: 0.5rem;
        }

        .homework-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .homework-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .homework-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .action-button {
            background: none;
            border: none;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .action-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--primary);
        }

        .delete-button:hover {
            color: var(--danger);
        }

        .homework-form {
            background: rgba(16, 36, 69, 0.85);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(100, 255, 218, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .homework-form h3 {
            color: var(--primary-light);
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-size: 1rem;
        }

        .submit-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .priority-high { border-left-color: var(--danger); }
        .priority-medium { border-left-color: var(--warning); }
        .priority-low { border-left-color: var(--success); }

        .due-soon {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        .overdue {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .homework-item {
            animation: fadeIn 0.3s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .day {
                min-width: 35px;
                font-size: 14px;
            }
            
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }

        /* Scrollbar personnalisée */
        .homework-list::-webkit-scrollbar {
            width: 6px;
        }

        .homework-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .homework-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .homework-list::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1><i class="fas fa-book-open mr-2"></i> Gestion des Devoirs</h1>
                <p class="opacity-90 mt-1">Organisez vos devoirs et suivez vos échéances</p>
            </div>
            <button class="logout-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
            </button>
        </header>

        <div class="main-grid">
            <!-- Calendrier -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <h2 id="current-month"></h2>
                    <div class="nav-buttons">
                        <button class="nav-button" id="prev-month">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="nav-button" id="next-month">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <div class="weekdays">
                    <div>Dim</div>
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mer</div>
                    <div>Jeu</div>
                    <div>Ven</div>
                    <div>Sam</div>
                </div>
                
                <div class="days-grid" id="calendar"></div>
                
                <div class="text-center">
                    <button class="today-button" id="today-btn">
                        <i class="fas fa-calendar-day mr-2"></i>Aujourd'hui
                    </button>
                </div>
            </div>

            <!-- Liste des devoirs -->
            <div class="homework-card">
                <div class="homework-header">
                    <h2><i class="fas fa-tasks mr-2"></i>Devoirs</h2>
                    <div class="date-display" id="selected-date">Sélectionnez une date</div>
                </div>
                
                <div class="homework-list" id="homework-list">
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>Sélectionnez une date pour voir les devoirs</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulaire d'ajout de devoir -->
        <div class="homework-form">
            <h3><i class="fas fa-plus-circle mr-2"></i>Ajouter un devoir</h3>
            <form id="homework-form">
                <div class="form-group">
                    <label for="homework-title">Titre du devoir</label>
                    <input type="text" id="homework-title" placeholder="Ex: Dissertation de français" required>
                </div>
                
                <div class="form-group">
                    <label for="homework-subject">Matière</label>
                    <select id="homework-subject" required>
                        <option value="">Sélectionner une matière</option>
                        <option value="mathematiques">Mathématiques</option>
                        <option value="francais">Français</option>
                        <option value="histoire">Histoire-Géographie</option>
                        <option value="sciences">Sciences</option>
                        <option value="anglais">Anglais</option>
                        <option value="physique">Physique-Chimie</option>
                        <option value="svt">SVT</option>
                        <option value="philosophie">Philosophie</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="homework-description">Description</label>
                    <textarea id="homework-description" placeholder="Description détaillée du devoir..." rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="homework-due-date">Date d'échéance</label>
                    <input type="date" id="homework-due-date" required>
                </div>
                
                <div class="form-group">
                    <label for="homework-priority">Priorité</label>
                    <select id="homework-priority">
                        <option value="low">Basse</option>
                        <option value="medium" selected>Moyenne</option>
                        <option value="high">Haute</option>
                    </select>
                </div>
                
                <button type="submit" class="submit-button">
                    <i class="fas fa-plus mr-2"></i>Ajouter le devoir
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { app, auth, db, SecurityUtils, DateUtils, handleFirebaseError } from "./firebase/firebase-config.js";

        // Variables globales
        let currentUser = null;
        let currentDate = new Date();
        let selectedDate = null;
        let homeworks = {};

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            initAuthState();
            generateCalendar();
            selectDate(new Date());
            setupEventListeners();
            setupFormValidation();
        });

        function initAuthState() {
            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.href = 'index.html';
                } else {
                    currentUser = user;
                    loadHomeworks();
                }
            });
        }

        function setupEventListeners() {
            // Navigation du calendrier
            document.getElementById('prev-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                generateCalendar();
            });

            document.getElementById('next-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                generateCalendar();
            });

            document.getElementById('today-btn').addEventListener('click', () => {
                currentDate = new Date();
                selectDate(new Date());
                generateCalendar();
            });

            // Formulaire
            document.getElementById('homework-form').addEventListener('submit', handleHomeworkSubmit);
            
            // Déconnexion
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
        }

        function setupFormValidation() {
            const form = document.getElementById('homework-form');
            const inputs = form.querySelectorAll('input, textarea, select');
            
            inputs.forEach(input => {
                input.addEventListener('input', validateInput);
                input.addEventListener('blur', validateInput);
            });
        }

        function validateInput(event) {
            const input = event.target;
            const value = input.value.trim();
            
            // Validation en temps réel
            switch(input.id) {
                case 'homework-title':
                    if (value.length < 3) {
                        setInputError(input, 'Le titre doit contenir au moins 3 caractères');
                    } else if (value.length > 100) {
                        setInputError(input, 'Le titre ne peut pas dépasser 100 caractères');
                    } else {
                        setInputValid(input);
                    }
                    break;
                    
                case 'homework-due-date':
                    const dueDate = new Date(value);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    
                    if (dueDate < today) {
                        setInputError(input, 'La date d\'échéance ne peut pas être dans le passé');
                    } else {
                        setInputValid(input);
                    }
                    break;
                    
                case 'homework-description':
                    if (value.length > 500) {
                        setInputError(input, 'La description ne peut pas dépasser 500 caractères');
                    } else {
                        setInputValid(input);
                    }
                    break;
            }
        }

        function setInputError(input, message) {
            input.style.borderColor = 'var(--danger)';
            input.title = message;
        }

        function setInputValid(input) {
            input.style.borderColor = 'var(--success)';
            input.title = '';
        }

        function generateCalendar() {
            const calendarEl = document.getElementById('calendar');
            const currentMonthEl = document.getElementById('current-month');
            calendarEl.innerHTML = '';

            const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 
                              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            currentMonthEl.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            const prevLastDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0).getDate();

            // Jours du mois précédent
            for (let i = startDay; i > 0; i--) {
                const day = prevLastDay - i + 1;
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, day);
                calendarEl.appendChild(createDayElement(day, date, true));
            }

            // Jours du mois actuel
            const today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), i);
                const isToday = DateUtils.isToday(date);
                calendarEl.appendChild(createDayElement(i, date, false, isToday));
            }

            // Jours du mois suivant
            const daysLeft = 42 - (startDay + daysInMonth);
            for (let i = 1; i <= daysLeft; i++) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, i);
                calendarEl.appendChild(createDayElement(i, date, true));
            }
        }

        function createDayElement(day, date, isOtherMonth, isToday = false) {
            const dayEl = document.createElement('div');
            dayEl.classList.add('day');
            dayEl.textContent = day;

            if (isOtherMonth) dayEl.classList.add('other-month');
            if (isToday) dayEl.classList.add('today');
            if (selectedDate && DateUtils.formatDateKey(date) === DateUtils.formatDateKey(selectedDate)) {
                dayEl.classList.add('selected');
            }

            // Vérifier s'il y a des devoirs pour cette date
            const dateKey = DateUtils.formatDateKey(date);
            if (homeworks[dateKey] && Object.keys(homeworks[dateKey]).length > 0) {
                dayEl.classList.add('has-homework');
            }

            dayEl.addEventListener('click', () => selectDate(date));
            return dayEl;
        }

        function selectDate(date) {
            selectedDate = date;
            document.getElementById('selected-date').textContent = DateUtils.formatDate(date);
            generateCalendar();
            displayHomeworks();
        }

        function loadHomeworks() {
            if (!currentUser) return;
            
            const homeworksRef = ref(db, `homeworks/${currentUser.uid}`);
            onValue(homeworksRef, (snapshot) => {
                homeworks = snapshot.val() || {};
                generateCalendar();
                if (selectedDate) {
                    displayHomeworks();
                }
            }, (error) => {
                console.error('Erreur lors du chargement des devoirs:', error);
                showNotification('Erreur lors du chargement des devoirs', 'error');
            });
        }

        function displayHomeworks() {
            const homeworkList = document.getElementById('homework-list');
            const dateKey = DateUtils.formatDateKey(selectedDate);
            const dayHomeworks = homeworks[dateKey] || {};

            homeworkList.innerHTML = '';

            if (Object.keys(dayHomeworks).length === 0) {
                homeworkList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>Aucun devoir pour cette date</p>
                    </div>
                `;
                return;
            }

            // Trier les devoirs par priorité et statut
            const sortedHomeworks = Object.entries(dayHomeworks).sort(([,a], [,b]) => {
                if (a.completed !== b.completed) return a.completed - b.completed;
                
                const priorityOrder = { high: 3, medium: 2, low: 1 };
                return priorityOrder[b.priority || 'medium'] - priorityOrder[a.priority || 'medium'];
            });

            sortedHomeworks.forEach(([id, homework]) => {
                const homeworkEl = createHomeworkElement(id, homework, dateKey);
                homeworkList.appendChild(homeworkEl);
            });
        }

        function createHomeworkElement(id, homework, dateKey) {
            const homeworkEl = document.createElement('div');
            homeworkEl.className = `homework-item priority-${homework.priority || 'medium'}`;
            
            if (homework.completed) {
                homeworkEl.classList.add('completed');
            }

            // Vérifier si le devoir est en retard ou bientôt dû
            const dueDate = new Date(homework.dueDate);
            const today = new Date();
            const diffTime = dueDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0 && !homework.completed) {
                homeworkEl.classList.add('overdue');
            } else if (diffDays <= 2 && diffDays >= 0 && !homework.completed) {
                homeworkEl.classList.add('due-soon');
            }

            homeworkEl.innerHTML = `
                <div class="homework-actions">
                    <button class="action-button edit-btn" data-id="${id}" title="Modifier">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="action-button delete-button delete-btn" data-id="${id}" title="Supprimer">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                
                <div class="homework-content">
                    <div class="homework-title">${SecurityUtils.sanitizeInput(homework.title)}</div>
                    <div class="text-sm mb-2">
                        <i class="fas fa-book mr-2"></i>${SecurityUtils.sanitizeInput(homework.subject)}
                    </div>
                    ${homework.description ? `<div class="text-sm text-gray-400 mb-2">${SecurityUtils.sanitizeInput(homework.description)}</div>` : ''}
                </div>
                
                <div class="homework-meta">
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" ${homework.completed ? 'checked' : ''} data-id="${id}" class="mr-2">
                            <span class="text-sm">${homework.completed ? 'Terminé' : 'À faire'}</span>
                        </label>
                    </div>
                    <div class="text-right">
                        <div class="text-xs">
                            <i class="fas fa-calendar mr-1"></i>
                            ${DateUtils.formatDate(new Date(homework.dueDate))}
                        </div>
                        ${diffDays < 0 ? '<div class="text-red-400 text-xs">En retard</div>' : 
                          diffDays === 0 ? '<div class="text-yellow-400 text-xs">Aujourd\'hui</div>' :
                          diffDays === 1 ? '<div class="text-orange-400 text-xs">Demain</div>' :
                          diffDays <= 2 ? '<div class="text-yellow-400 text-xs">Bientôt</div>' : ''}
                    </div>
                </div>
            `;

            // Événements
            const checkbox = homeworkEl.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', () => toggleHomeworkComplete(id, dateKey, checkbox.checked));

            const editBtn = homeworkEl.querySelector('.edit-btn');
            editBtn.addEventListener('click', () => editHomework(id, homework, dateKey));

            const deleteBtn = homeworkEl.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', () => deleteHomework(id, dateKey));

            return homeworkEl;
        }

        function handleHomeworkSubmit(event) {
            event.preventDefault();
            
            const title = document.getElementById('homework-title').value.trim();
            const subject = document.getElementById('homework-subject').value;
            const description = document.getElementById('homework-description').value.trim();
            const dueDate = document.getElementById('homework-due-date').value;
            const priority = document.getElementById('homework-priority').value;

            // Validation
            if (!SecurityUtils.validateInput(title, 3, 100)) {
                showNotification('Le titre doit contenir entre 3 et 100 caractères', 'error');
                return;
            }

            if (!subject) {
                showNotification('Veuillez sélectionner une matière', 'error');
                return;
            }

            if (!dueDate) {
                showNotification('Veuillez sélectionner une date d\'échéance', 'error');
                return;
            }

            const dueDateObj = new Date(dueDate);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (dueDateObj < today) {
                showNotification('La date d\'échéance ne peut pas être dans le passé', 'error');
                return;
            }

            if (description.length > 500) {
                showNotification('La description ne peut pas dépasser 500 caractères', 'error');
                return;
            }

            addHomework(title, subject, description, dueDate, priority);
        }

        async function addHomework(title, subject, description, dueDate, priority) {
            if (!currentUser) return;

            try {
                const dateKey = DateUtils.formatDateKey(new Date(dueDate));
                const homeworkRef = ref(db, `homeworks/${currentUser.uid}/${dateKey}`);
                const newHomeworkRef = push(homeworkRef);

                const homeworkData = {
                    title: SecurityUtils.sanitizeInput(title),
                    subject: SecurityUtils.sanitizeInput(subject),
                    description: SecurityUtils.sanitizeInput(description),
                    dueDate: dueDate,
                    priority: priority,
                    completed: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };

                await set(newHomeworkRef, homeworkData);
                
                // Réinitialiser le formulaire
                document.getElementById('homework-form').reset();
                
                // Si le devoir est ajouté pour la date sélectionnée, actualiser l'affichage
                if (selectedDate && DateUtils.formatDateKey(selectedDate) === dateKey) {
                    selectDate(new Date(dueDate));
                }

                showNotification('Devoir ajouté avec succès', 'success');
                
            } catch (error) {
                console.error('Erreur lors de l\'ajout du devoir:', error);
                showNotification(handleFirebaseError(error), 'error');
            }
        }

        async function toggleHomeworkComplete(homeworkId, dateKey, completed) {
            if (!currentUser) return;

            try {
                const homeworkRef = ref(db, `homeworks/${currentUser.uid}/${dateKey}/${homeworkId}`);
                await update(homeworkRef, {
                    completed: completed,
                    updatedAt: Date.now()
                });

                showNotification(completed ? 'Devoir marqué comme terminé' : 'Devoir marqué comme à faire', 'success');
                
            } catch (error) {
                console.error('Erreur lors de la mise à jour du devoir:', error);
                showNotification(handleFirebaseError(error), 'error');
            }
        }

        function editHomework(homeworkId, homework, dateKey) {
            // Pré-remplir le formulaire avec les données existantes
            document.getElementById('homework-title').value = homework.title;
            document.getElementById('homework-subject').value = homework.subject;
            document.getElementById('homework-description').value = homework.description || '';
            document.getElementById('homework-due-date').value = homework.dueDate;
            document.getElementById('homework-priority').value = homework.priority || 'medium';

            // Modifier le bouton de soumission
            const submitBtn = document.querySelector('.submit-button');
            submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Modifier le devoir';
            submitBtn.style.backgroundColor = 'var(--warning)';

            // Remplacer l'événement de soumission
            const form = document.getElementById('homework-form');
            const newForm = form.cloneNode(true);
            form.parentNode.replaceChild(newForm, form);

            newForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                try {
                    const updatedHomework = {
                        title: SecurityUtils.sanitizeInput(document.getElementById('homework-title').value.trim()),
                        subject: SecurityUtils.sanitizeInput(document.getElementById('homework-subject').value),
                        description: SecurityUtils.sanitizeInput(document.getElementById('homework-description').value.trim()),
                        dueDate: document.getElementById('homework-due-date').value,
                        priority: document.getElementById('homework-priority').value,
                        completed: homework.completed,
                        createdAt: homework.createdAt,
                        updatedAt: Date.now()
                    };

                    const homeworkRef = ref(db, `homeworks/${currentUser.uid}/${dateKey}/${homeworkId}`);
                    await update(homeworkRef, updatedHomework);

                    // Restaurer le formulaire
                    resetForm();
                    showNotification('Devoir modifié avec succès', 'success');
                    
                } catch (error) {
                    console.error('Erreur lors de la modification du devoir:', error);
                    showNotification(handleFirebaseError(error), 'error');
                }
            });

            // Scroll vers le formulaire
            newForm.scrollIntoView({ behavior: 'smooth' });
        }

        async function deleteHomework(homeworkId, dateKey) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce devoir ?')) return;

            try {
                const homeworkRef = ref(db, `homeworks/${currentUser.uid}/${dateKey}/${homeworkId}`);
                await remove(homeworkRef);
                showNotification('Devoir supprimé avec succès', 'success');
                
            } catch (error) {
                console.error('Erreur lors de la suppression du devoir:', error);
                showNotification(handleFirebaseError(error), 'error');
            }
        }

        function resetForm() {
            document.getElementById('homework-form').reset();
            const submitBtn = document.querySelector('.submit-button');
            submitBtn.innerHTML = '<i class="fas fa-plus mr-2"></i>Ajouter le devoir';
            submitBtn.style.backgroundColor = 'var(--primary)';
            
            // Restaurer l'événement de soumission original
            setupEventListeners();
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Erreur lors de la déconnexion:", error);
                showNotification("Une erreur est survenue lors de la déconnexion", 'error');
            }
        }

        function showNotification(message, type = 'info') {
            // Créer une notification toast simple
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
                max-width: 400px;
                word-wrap: break-word;
            `;

            const colors = {
                success: 'var(--success)',
                error: 'var(--danger)',
                warning: 'var(--warning)',
                info: 'var(--primary)'
            };

            notification.style.backgroundColor = colors[type] || colors.info;
            notification.textContent = message;

            document.body.appendChild(notification);

            // Supprimer automatiquement après 4 secondes
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 4000);
        }

        // Ajouter les animations CSS pour les notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
